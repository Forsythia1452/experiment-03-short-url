name: experiment03-short-url

services:
  db:
    image: postgres:${POSTGRES_TAG:-16.14-alpine}
    environment:
      POSTGRES_DB: shlink
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env中设置POSTGRES_PASSWORD}
    volumes:
      - shlink-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlink -d shlink"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  shlink:
    image: shlinkio/shlink:${SHLINK_TAG:-5.1.6}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:8080}
      IS_HTTPS_ENABLED: "false"
      DB_DRIVER: postgres
      DB_HOST: db
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      INITIAL_API_KEY: ${INITIAL_API_KEY:?请在.env中设置INITIAL_API_KEY}
      AUTO_RESOLVE_TITLES: "false"
      SKIP_INITIAL_GEOLITE_DOWNLOAD: "true"
    ports:
      - "127.0.0.1:${SHLINK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/rest/health')===false?1:0);"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      shlink:
        condition: service_healthy
    environment:
      WEB_PORT: "8501"
      SHLINK_BASE_URL: http://shlink:8080
      SHLINK_PUBLIC_URL: http://${DEFAULT_DOMAIN:-localhost:8080}
      SHLINK_API_KEY: ${INITIAL_API_KEY}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
    ports:
      - "127.0.0.1:${WEB_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8501/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  shlink-db:
    name: experiment03-shlink-db

